services:
  order-offer-service:
    build:
      context: ./src/order_offer_service
    command: "uvicorn order_offer_service.app.main:app --host 0.0.0.0 --port 8080"
    environment:
      POSTGRES_DSN: postgresql+asyncpg://orders_user:orders_pass@postgres:5432/orders_db
      REDIS_DSN: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: orders-archive
      STUB_SERVICE_BASE_URL: http://support-stubs:8081
      LOG_LEVEL: INFO
    depends_on:
      - postgres
      - redis
      - minio
      - support-stubs
    ports:
      - "8080:8080"

  support-stubs:
    build:
      context: ./src/support_stubs
    command: "uvicorn support_stubs.app.main:app --host 0.0.0.0 --port 8081"
    ports:
      - "8081:8081"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
      POSTGRES_DB: orders_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-07-26T20-48-21Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9009:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.1
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./src/clickhouse/init:/init:ro
    entrypoint: ["/bin/bash", "/init/init-db.sh"]
    environment:
      CLICKHOUSE_HOST: clickhouse
    restart: "no"

  airflow:
    build:
      context: ./src/airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: orders-archive
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: default
      METABASE_URL: http://metabase:3000
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8082:8080"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_started
    command: standalone
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  airflow-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  metabase:
    build:
      context: ./src/metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: metabase-postgres
      MB_PLUGINS_DIR: /plugins
      JAVA_TIMEZONE: UTC
    volumes:
      - ./src/metabase/setup:/setup:ro
      - metabase-plugins:/plugins
    ports:
      - "3001:3000"
    depends_on:
      metabase-postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10

  metabase-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: metabase
    volumes:
      - metabase-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 5s
      timeout: 5s
      retries: 5

  tests:
    build:
      context: ./src/order_offer_service
    command: pytest -v --disable-warnings
    environment:
      POSTGRES_DSN: postgresql+asyncpg://orders_user:orders_pass@postgres:5432/orders_db
      PYTHONPATH: /app
    depends_on:
      - postgres
    volumes:
      - ./src:/app

volumes:
  postgres-data:
  minio-data:
  clickhouse-data:
  airflow-logs:
  airflow-postgres-data:
  metabase-postgres-data:
  metabase-plugins:
